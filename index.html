<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Ficha Análise de Crédito</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/x-icon" href="/6827181.ico">
<script src="scripts.js" defer></script>
</head>
<body>
<div class="container">
<h1>Ficha Análise de Crédito</h1>

<form id="formFicha">
    
<label>Nome Completo <span class="required">*</span></label>
<input type="text" id="nome" required>

<label>Data de Nascimento <span class="required">*</span></label>
<input type="date" id="dataNascimento" required>

<label>Nome da mãe <span class="required">*</span></label>
<input type="text" id="nomeMae" required>

<label>Nome do pai</label>
<input type="text" id="nomePai">

<label>Natural de qual cidade <span class="required">*</span></label>
<input type="text" id="naturalidade" required>

<label>CPF <span class="required">*</span></label>
<input type="text" id="cpf" required maxlength="14">

<div class="row">
    <div class="col">
        <label>RG <span class="required">*</span></label>
        <input type="text" id="rg" required>
    </div>
    <div class="col">
        <label>Data Expedição RG <span class="required">*</span></label>
        <input type="date" id="rgData" required>
    </div>
</div>

<div class="form-group">
  <label for="modeloMoto">Qual tipo de imóvel?</label>
  <select id="modeloMoto" name="modeloMoto" required>
    <option value="" disabled selected>Selecione:</option>
    <option value="Biz 110i">Casa</option>
    <option value="Biz 125">Apartamento</option>
  </select>
</div>

<label>Estado Civil <span class="required">*</span></label>
<select id="estadoCivil" required>
    <option value="">Selecione</option>
    <option>Solteiro(a)</option>
    <option>Casado(a)</option>
    <option>Divorciado(a)</option>
    <option>Viúvo(a)</option>
</select>

<div class="row">
    <div class="col">
        <label>Nº CNH</label>
        <input type="text" id="cnh">
    </div>
    <div class="col">
        <label>Data Expedição CNH</label>
        <input type="date" id="cnhData">
    </div>
</div>

<label>CEP <span class="required">*</span></label>
<input type="text" id="cep" required maxlength="9">

<div class="row">
    <div class="col">
        <label>Endereço <span class="required">*</span></label>
        <input type="text" id="endereco" required>
    </div>
    <div class="col">
        <label>Bairro <span class="required">*</span></label>
        <input type="text" id="bairro" required>
    </div>
</div>

<div class="row">
    <div class="col">
        <label>Número <span class="required">*</span></label>
        <input type="text" id="numeroCasa" required>
    </div>
    <div class="col">
        <label>Complemento</label>
        <input type="text" id="complemento">
    </div>
</div>

<label>Telefone <span class="required">*</span></label>
<input type="text" id="telefone" required maxlength="15">

<label>E-mail <span class="required">*</span></label>
<input type="email" id="email" required>

<label>Profissão <span class="required">*</span></label>
<input type="text" id="profissao" required>

<label>Empresa <span class="required">*</span></label>
<input type="text" id="empresa" required>

<label>Renda Mensal 💼💰 <span class="required">*</span></label>
<input type="text" id="renda" required>

<label>Referência Pessoal <span class="required">*</span></label>
<div class="row">
    <div class="col">
        <input type="text" id="refNome" placeholder="Nome" required>
    </div>
    <div class="col">
        <select id="refGrau" required>
            <option value="">Grau</option>
            <option>Pai / Mãe</option>
            <option>Cônjuge</option>
            <option>Irmão(ã)</option>
            <option>Parente</option>
            <option>Amigo(a)</option>
            <option>Outro</option>
        </select>
    </div>
    <div class="col">
        <input type="text" id="refTelefone" placeholder="(00) 00000-0000" required maxlength="15">
    </div>
</div>

<label>Entrada? <span class="required">*</span></label>
<select id="entrada" required>
    <option value="">Selecione</option>
    <option value="Sim">Sim</option>
    <option value="Não">Não</option>
</select>

<div id="valorEntradaDiv" class="hidden">
    <label>Valor da Entrada (R$) <span class="required">*</span></label>
    <input type="text" id="valorEntrada">
</div>

<button type="submit">Gerar ficha e enviar ao consultor</button>

</form>
</div>
</body>
</html>
